<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pitch · Viewport-Prüfrahmen</title>
  <style>
    body { margin: 12px; background: #15202a; color: #eff3ed; font: 13px/1.3 system-ui, sans-serif; }
    .controls { display: flex; align-items: center; gap: 8px; height: 36px; margin-bottom: 8px; white-space: nowrap; }
    button, select { height: 32px; box-sizing: border-box; border: 1px solid #627481; border-radius: 4px; padding: 0 10px; background: #20313e; color: inherit; font: inherit; }
    button { cursor: pointer; }
    button[aria-pressed="true"] { border-color: #efbd91; color: #efbd91; background: #35404a; }
    button:focus-visible, select:focus-visible { outline: 2px solid #a9d9d9; outline-offset: 2px; }
    label { margin-left: 5px; }
    output { color: #b7c9d2; font-variant-numeric: tabular-nums; }
    iframe { display: block; box-sizing: content-box; border: 1px solid #627481; background: #060b10; }
  </style>
</head>
<body>
  <div class="controls" role="group" aria-label="Prüfgröße und Kapitel wählen">
    <button type="button" data-width="1280" data-height="720" aria-pressed="true">1280 × 720</button>
    <button type="button" data-width="1366" data-height="768" aria-pressed="false">1366 × 768</button>
    <button type="button" data-width="390" data-height="844" aria-pressed="false">390 × 844</button>
    <label for="chapter">Kapitel</label>
    <select id="chapter">
      <option value="2">2 · Prüfstand</option>
      <option value="3">3 · Auswahl</option>
      <option value="4">4 · Bewertung</option>
      <option value="5" selected>5 · Marketingmix</option>
      <option value="6">6 · Roadmap</option>
      <option value="7">7 · Management</option>
      <option value="8">8 · Evaluation</option>
    </select>
    <output id="size" aria-live="polite">1280 × 720 CSS-Pixel</output>
  </div>
  <iframe id="preview" title="RocketLight-Pitch im gewählten Viewport" width="1280" height="720" src="../../pitch/?variante=A&amp;v=b7d944ec#schritt-5"></iframe>
  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(location.search);
      const frame = document.getElementById('preview');
      const chapter = document.getElementById('chapter');
      const size = document.getElementById('size');
      const presets = Array.from(document.querySelectorAll('[data-width][data-height]'));
      function numberParam(name, fallback, min, max) {
        const value = params.get(name);
        if (!value || !/^\d{1,4}$/.test(value)) return fallback;
        const number = Number(value);
        return Number.isInteger(number) && number >= min && number <= max ? number : fallback;
      }
      function resize(width, height) {
        frame.width = String(width);
        frame.height = String(height);
        size.textContent = `${width} × ${height} CSS-Pixel`;
        presets.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.width) === width && Number(button.dataset.height) === height)));
      }
      function showChapter(value) {
        frame.src = `../../pitch/?variante=A&v=b7d944ec#schritt-${value}`;
      }
      presets.forEach(button => button.addEventListener('click', () => resize(Number(button.dataset.width), Number(button.dataset.height))));
      chapter.addEventListener('change', () => showChapter(Number(chapter.value)));
      resize(numberParam('w', 1280, 320, 3840), numberParam('h', 720, 240, 2160));
      const initialChapter = numberParam('chapter', 5, 2, 8);
      chapter.value = String(initialChapter);
      if (initialChapter !== 5) showChapter(initialChapter);
    })();
  </script>
</body>
</html>
